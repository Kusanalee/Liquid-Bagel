<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="tileFill" cx="34%" cy="20%" r="86%">
      <stop offset="0%" stop-color="#43506a"/>
      <stop offset="54%" stop-color="#142238"/>
      <stop offset="100%" stop-color="#07111f"/>
    </radialGradient>
    <linearGradient id="tileRim" x1="146" y1="68" x2="888" y2="956" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eef5ff" stop-opacity=".5"/>
      <stop offset="45%" stop-color="#7b8aa7" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#020713" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="glassFill" cx="37%" cy="25%" r="76%">
      <stop offset="0%" stop-color="#eff6ff" stop-opacity=".68"/>
      <stop offset="36%" stop-color="#7f91b0" stop-opacity=".35"/>
      <stop offset="72%" stop-color="#18253c" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#091424" stop-opacity=".08"/>
    </radialGradient>
    <linearGradient id="bagelStroke" x1="282" y1="206" x2="760" y2="830" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#b8d0ff"/>
      <stop offset="74%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#6bb7ff"/>
